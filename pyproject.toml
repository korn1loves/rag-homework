[project]
name = "rag-homework"
version = "0.1.0"
description = "Educational RAG pipeline with TF-IDF retrieval and Streamlit UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]